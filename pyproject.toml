[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "process-water-dynamics-model"
version = "1.0.0"
description = "Dynamic microbial, hydraulic and disinfectant model for process-water validation studies."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
process-water-model = "process_water_model.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
